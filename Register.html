<!DOCTYPE html>
<html>
    <head>
        <title>
            Register
        </title>
        <link rel="stylesheet" href="style3.css">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
    </head>
    <body>
        <div class="video">
            <video class="videosrc" play-inline autoplay muted loop>
                <source src="assests/video/High tech digital world background 4k.mp4" type="video/mp4">
            </video>
        </div>
        <div class="register">
            <h1>REGISTER</h1>
            <div class="username">
                Username :
                <input type="text" class="name box">
            </div>
            <div class="email">
                Email :
                <input class="id box" type="email">
            </div>
            <div class="password">
                Password :
                <input type="password" class="pass box">
            </div>
            <div class="button">
                <button>Register</button>
            </div>
        </div>
    </body>
    <script src="script/register.js"></script>
</html>
